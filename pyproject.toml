[project]
name = "mlx-whisperx"
version = "0.1.6"
description = "WhisperX-style transcription pipeline using an internal mlx-whisper ASR backend."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "mlx>=0.11",
    "numpy",
    "numba",
    "more-itertools",
    "tiktoken",
    "huggingface-hub",
    "scipy",
    "pandas",
    "torch==2.11.*",
    "torchaudio==2.11.*",
    "transformers>=5,<6",
    "nltk",
    "tqdm",
]

[project.optional-dependencies]
diarize = [
    "pyannote-audio",
]
full = [
    "pyannote-audio",
]
dev = [
    "pytest",
]

[project.scripts]
mlx-whisperx = "mlx_whisperx.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mlx_whisperx*"]

[tool.setuptools.package-data]
"mlx_whisperx.backend.mlx_whisper" = ["assets/*.npz", "assets/*.tiktoken"]
